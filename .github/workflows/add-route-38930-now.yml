name: Add route 38930 now

on:
  push:
    paths:
      - '.github/workflows/add-route-38930-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch route and AI topic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          routes_path = Path('telegram_worker/routes.py')
          routes = routes_path.read_text(encoding='utf-8')
          route_name = 'Mirror Route38930 2817163788 16218'
          if route_name not in routes:
              old = "  {'name': 'Mirror Route568 3894275482',\n   'source_chat': -1003894275482,\n   'source_topic': None,\n   'dest_chat': -1003918958200,\n   'dest_topic': 568,\n   'verify_title': False}]"
              new = "  {'name': 'Mirror Route568 3894275482',\n   'source_chat': -1003894275482,\n   'source_topic': None,\n   'dest_chat': -1003918958200,\n   'dest_topic': 568,\n   'verify_title': False},\n  {'name': 'Mirror Route38930 2817163788 16218',\n   'source_chat': -1002817163788,\n   'source_topic': 16218,\n   'dest_chat': -1003918958200,\n   'dest_topic': 38930,\n   'verify_title': False}]"
              if old not in routes:
                  raise SystemExit('Could not find expected end of ROUTES')
              routes = routes.replace(old, new, 1)
              routes_path.write_text(routes, encoding='utf-8')

          hub_path = Path('telegram_worker/worker_signal_hub.py')
          hub = hub_path.read_text(encoding='utf-8')
          old_topics = '29327,29452,26902"'
          new_topics = '29327,29452,26902,38930"'
          if ',38930"' not in hub:
              if old_topics not in hub:
                  raise SystemExit('Could not find DEFAULT_ALLOWED_TOPICS tail')
              hub = hub.replace(old_topics, new_topics, 1)
              hub_path.write_text(hub, encoding='utf-8')
          PY

          python -m py_compile telegram_worker/routes.py telegram_worker/worker_signal_hub.py
          rm -f .github/workflows/add-route-38930-now.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_worker/routes.py telegram_worker/worker_signal_hub.py .github/workflows/add-route-38930-now.yml
          git commit -m 'Add mirror route 38930 from source topic 16218'
          git push origin HEAD:main
