name: Add route 568 now

on:
  push:
    paths:
      - '.github/workflows/add-route-568-now.yml'

permissions:
  contents: write

jobs:
  add-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add route directly
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import pprint
          from pathlib import Path

          path = Path('telegram_worker/routes.py')
          spec = importlib.util.spec_from_file_location('routes_mod', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          routes = list(mod.ROUTES)
          route = {
              'name': 'Mirror Route568 3894275482',
              'source_chat': -1003894275482,
              'source_topic': None,
              'dest_chat': -1003918958200,
              'dest_topic': 568,
              'verify_title': False,
          }

          exists = any(
              int(r.get('source_chat')) == route['source_chat']
              and r.get('source_topic') is None
              and int(r.get('dest_chat')) == route['dest_chat']
              and int(r.get('dest_topic')) == route['dest_topic']
              for r in routes
          )
          if not exists:
              routes.append(route)

          text = (
              'import os\n\n'
              '# telegram_worker/routes.py\n'
              '# source_topic=None means all messages from that source.\n\n'
              'ROUTES = '
              + pprint.pformat(routes, width=120, sort_dicts=False)
              + '\n\n'
              'if os.environ.get("DISABLE_PROVIDER_ROUTES", "0").strip() == "1":\n'
              '    ROUTES = []\n'
          )
          path.write_text(text, encoding='utf-8')
          print(f'route_exists_before={exists}')
          PY

          python -m py_compile telegram_worker/routes.py
          rm -f .github/workflows/add-route-568-now.yml

      - name: Commit route
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_worker/routes.py .github/workflows/add-route-568-now.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Add mirror route 568 from 3894275482'
            git push origin HEAD:main
          fi
