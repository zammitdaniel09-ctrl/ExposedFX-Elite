name: Forwarding safety and syntax

on:
  pull_request:
    branches: [main]
    paths:
      - "telegram_worker/**"
      - "tests/**"
      - "scripts/check_forwarding_contracts.py"
      - ".github/workflows/forwarding-safety.yml"
  push:
    branches: [main]
    paths:
      - "telegram_worker/**"
      - "tests/**"
      - "scripts/check_forwarding_contracts.py"
      - ".github/workflows/forwarding-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check worker syntax and forwarding safety
        run: python scripts/check_forwarding_contracts.py
      - name: Install test dependencies
        run: pip install "telethon==1.45.0" "black==26.10.1" "pyflakes==4.1.0"
      - name: Formatting (black, same flags as local)
        run: black --check --skip-magic-trailing-comma -l 110 telegram_worker scripts tests
      - name: Undefined names and unused imports in the live workers and engine
        run: python -m pyflakes telegram_worker/engine telegram_worker/worker_fixed.py telegram_worker/liveness.py telegram_worker/log_setup.py telegram_worker/health_monitor.py
      - name: Run worker regression tests (offline, no credentials)
        run: python -m unittest discover -s tests -v
