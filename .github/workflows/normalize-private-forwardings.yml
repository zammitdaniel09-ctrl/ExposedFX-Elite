# trigger
name: Normalize private forwardings

on:
  push:
    paths:
      - '.github/workflows/normalize-private-forwardings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only exact requested private routes
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pprint
          from pathlib import Path

          p = Path('telegram_worker/routes.py')
          text = p.read_text(encoding='utf-8-sig')
          tree = ast.parse(text)
          routes = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'ROUTES' for t in node.targets):
                  routes = ast.literal_eval(node.value)
                  break
          if routes is None:
              raise SystemExit('Could not read ROUTES')

          routes = [
              r for r in routes
              if not (
                  int(r.get('dest_chat', 0)) == -1003852763875
                  and int(r.get('dest_topic', 0)) in {2524, 5551, 5632}
              )
          ]

          exact = [
              {'name':'Private Live 3651353503 To 5551','source_chat':-1003651353503,'source_topic':None,'dest_chat':-1003852763875,'dest_topic':5551,'verify_title':False,'anonymous_send_as':False,'live_only':True,'copy_reply_parent':False},
              {'name':'Private Live 3812195730 To 5632','source_chat':-1003812195730,'source_topic':None,'dest_chat':-1003852763875,'dest_topic':5632,'verify_title':False,'anonymous_send_as':False,'live_only':True,'copy_reply_parent':False},
              {'name':'Private Live 3801452999 To 5632','source_chat':-1003801452999,'source_topic':None,'dest_chat':-1003852763875,'dest_topic':5632,'verify_title':False,'anonymous_send_as':False,'live_only':True,'copy_reply_parent':False},
              {'name':'Private Live 2186832814 To 5632','source_chat':-1002186832814,'source_topic':None,'dest_chat':-1003852763875,'dest_topic':5632,'verify_title':False,'anonymous_send_as':False,'live_only':True,'copy_reply_parent':False},
          ]
          routes.extend(exact)

          out = (
              'import os\n\n'
              '# telegram_worker/routes.py\n'
              '# source_topic=None means all messages from that source.\n\n'
              'ROUTES = ' + pprint.pformat(routes, width=120, sort_dicts=False) + '\n\n'
              'if os.environ.get("DISABLE_PROVIDER_ROUTES", "0").strip() == "1":\n'
              '    ROUTES = []\n'
          )
          p.write_text(out, encoding='utf-8')

          print('EXACT_PRIVATE_ROUTES=4')
          print('OLD_2524_REMOVED=True')
          print('DUPLICATES_REMOVED=True')
          print('SEND_AS_KRATOS=True')
          print('NO_HISTORY=True')
          PY

          python -m py_compile telegram_worker/routes.py telegram_worker/worker_fixed.py

      - name: Commit normalized routes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_worker/routes.py .github/workflows/normalize-private-forwardings.yml
          git rm .github/workflows/normalize-private-forwardings.yml
          git commit -m 'Normalize requested private forwardings'
          git push origin HEAD:main
